name: Update close data and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1-5'
    - cron: '35,40 8 * * 1-5'
    - cron: '35 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture market briefing after 13:30 Taipei
        if: github.event_name != 'schedule' || github.event.schedule == '35 5 * * *'
        run: python scripts/update-morning.py
      - name: Capture latest completed TX night session
        if: github.event_name != 'schedule' || github.event.schedule == '35 5 * * *'
        run: python scripts/update-night.py
      - name: Update complete daily close data
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Commit a new trading day when available
        id: commit
        run: |
          if ! git diff --quiet -- data/history.json data/morning.json data/night.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/morning.json data/night.json
            git commit -m "data: update daily market snapshots"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
